[workspace]

[package]
name = "libchdb"
edition = "2024"

[lib]
name = "chdb"
crate-type = ["cdylib"]

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[dependencies]
chdb-rust = { version = "1.4.0", default-features = false, features = ["static"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }
thiserror = "2.0.18"
