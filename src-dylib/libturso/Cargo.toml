[workspace]

[package]
name = "libturso"
edition = "2024"

[lib]
name = "turso"
crate-type = ["cdylib"]

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[dependencies]
turso_core = { version = "0.8.0-pre.7", default-features = false }
turso_sdk_kit = { version = "0.8.0-pre.7", features = ["fts"] }
